name: Release

# Выпуск фабрики документов и шаблонов (решения 7 и 15 PRD компонента 71).
#
# По тегу `vX.Y.Z` (или предварительному `vX.Y.Z-dev.N`):
#   1. полный прогон workflow Factory — эталоны, типы, заморозка версий;
#   2. тег обязан совпасть с версией обоих пакетов: `@coopenomics/docs-factory`
#      (корень) и `@coopenomics/docs-templates` (packages/docs-templates) —
#      шаблон и сборщик одной версии совпадают по построению;
#   3. публикация в npm (`NPM_TOKEN`): сначала шаблоны, затем фабрика (её
#      `workspace:*` на шаблоны pnpm заменяет точной версией); предварительная
#      версия — с меткой `next`;
#   4. робот встраивает новую версию в монорепозиторий C9S/mono сам — висящих
#      PR на человека нет (решение владельца 01.11.2026). Куда — называет тег:
#      - аннотированный тег с строкой `mono: <ветка>` в сообщении — выпуск
#        сделан ради этой ветки монорепы (текст документа под её модель).
#        Робот кладёт коммит с версией прямо в неё, без PR и без проверки:
#        ветку проверяет её автор до слияния, в dev выпуск попадает вместе с ней;
#      - без строки `mono:` — выпуск ни к чему не привязан и идёт в `dev`.
#        Робот кладёт коммит с версией на полигон `ci/tests-docs-factory-vX.Y.Z`,
#        ждёт Typecheck, Check и Tests монорепы и при зелёном вердикте кладёт
#        коммит в `dev` сам. Красный вердикт, конфликт или отказ записи в dev —
#        единственный случай, когда робот открывает PR: его чинит агент, не владелец;
#      - предварительная версия в `dev` не идёт никогда: без строки `mono:`
#        робот её только публикует.
#   Пример тега, привязанного к ветке:
#     git tag -a v1.5.3 -m "mono: feat/mkt-secure-part"
#
# Секреты репозитория: NPM_TOKEN (публикация), GITEA_TOKEN (запись в C9S/mono).
on:
  push:
    tags: ['v*']

jobs:
  checks:
    uses: ./.github/workflows/factory.yml

  publish:
    needs: checks
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
      target: ${{ steps.target.outputs.target }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Тег совпадает с версией пакета
        id: version
        run: |
          version=$(node -p "require('./package.json').version")
          templates=$(node -p "require('./packages/docs-templates/package.json').version")
          if [ "v$version" != "${GITHUB_REF_NAME}" ] || [ "$templates" != "$version" ]; then
            echo "Тег ${GITHUB_REF_NAME}: версия фабрики $version, версия шаблонов $templates — должны совпасть с тегом" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          case "$version" in *-*) echo "prerelease=true" >> "$GITHUB_OUTPUT" ;; *) echo "prerelease=false" >> "$GITHUB_OUTPUT" ;; esac

      # Ветка монорепы, ради которой сделан выпуск, — строка `mono: <ветка>` в
      # сообщении аннотированного тега. Лёгкий тег сообщения не несёт.
      - name: Адресат выпуска в монорепе
        id: target
        run: |
          git fetch --force origin "+refs/tags/${GITHUB_REF_NAME}:refs/tags/${GITHUB_REF_NAME}"
          target=""
          if [ "$(git cat-file -t "refs/tags/${GITHUB_REF_NAME}")" = "tag" ]; then
            target=$(git cat-file -p "refs/tags/${GITHUB_REF_NAME}" | sed -n 's/^mono:[[:space:]]*\([^[:space:]]*\).*$/\1/p' | head -1)
          fi
          echo "адресат выпуска: ${target:-dev через проверку}"
          echo "target=$target" >> "$GITHUB_OUTPUT"

      - run: pnpm install --frozen-lockfile

      - name: Публикация в npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          tag=latest
          [ "${{ steps.version.outputs.prerelease }}" = "true" ] && tag=next
          pnpm --filter @coopenomics/docs-templates publish --access public --no-git-checks --tag "$tag"
          pnpm publish --access public --no-git-checks --tag "$tag"

      # Прежнее имя пакета (до выноса из монорепозитория) — устаревшее.
      # Повтор на каждом выпуске безвреден: пометка просто подтверждается.
      - name: Прежний @coopenomics/factory — устаревший
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          npm deprecate @coopenomics/factory "Пакет переименован: используйте @coopenomics/docs-factory (репозиторий C9S/docs-factory)" \
            || echo "пометка не поставлена — проверьте права токена на @coopenomics/factory"

  bump-mono:
    needs: publish
    runs-on: ubuntu-latest
    # Проверка монорепы на полигоне идёт до часа; запас на очередь раннеров.
    timeout-minutes: 240
    env:
      VERSION: ${{ needs.publish.outputs.version }}
      PRERELEASE: ${{ needs.publish.outputs.prerelease }}
      TARGET: ${{ needs.publish.outputs.target }}
      GITEA_URL: https://git.coopenomics.world
      GITEA_TOKEN: ${{ secrets.GITEA_TOKEN }}
      # Чтение итогов проверок открытого зеркала coopenomics/mono.
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Куда встраивать
        run: |
          if [ -n "$TARGET" ]; then
            echo "BASE=$TARGET" >> "$GITHUB_ENV"; echo "MODE=branch" >> "$GITHUB_ENV"
            echo "выпуск ${VERSION} встраивается в ветку монорепы ${TARGET}"
          elif [ "$PRERELEASE" = "true" ]; then
            echo "MODE=skip" >> "$GITHUB_ENV"
            echo "предварительная версия ${VERSION} без строки mono: в теге — только публикация, в dev не идёт"
          else
            echo "BASE=dev" >> "$GITHUB_ENV"; echo "MODE=dev" >> "$GITHUB_ENV"
            echo "выпуск ${VERSION} идёт в dev после проверки монорепы"
          fi

      # Пакет только что опубликован; реестр npm отдаёт его не сразу.
      - name: Дождаться версии в npm
        if: env.MODE != 'skip'
        run: |
          for i in $(seq 1 30); do
            npm view "@coopenomics/docs-factory@${VERSION}" version >/dev/null 2>&1 \
              && npm view "@coopenomics/docs-templates@${VERSION}" version >/dev/null 2>&1 && exit 0
            sleep 10
          done
          echo "Версия ${VERSION} не появилась в npm за 5 минут" >&2
          exit 1

      - name: Коммит с новой версией
        if: env.MODE != 'skip'
        run: |
          git clone --depth 50 --branch "$BASE" "https://docs-factory-bot:${GITEA_TOKEN}@git.coopenomics.world/C9S/mono.git" mono
          cd mono
          # Точная версия во всех package.json, где пакет объявлен.
          node -e '
            const fs = require("fs");
            const v = process.env.VERSION;
            const files = require("child_process").execSync("git ls-files \"package.json\" \"**/package.json\"").toString().trim().split("\n");
            let changed = 0;
            for (const f of files) {
              const p = JSON.parse(fs.readFileSync(f, "utf8"));
              let touched = false;
              for (const k of ["dependencies", "devDependencies", "peerDependencies"]) {
                for (const name of ["@coopenomics/docs-factory", "@coopenomics/docs-templates"]) {
                  if (p[k] && p[k][name] !== undefined && p[k][name] !== v) {
                    p[k][name] = v; touched = true;
                  }
                }
              }
              if (touched) { fs.writeFileSync(f, JSON.stringify(p, null, 2) + "\n"); changed++; console.log("версия обновлена:", f); }
            }
            if (!changed) { console.log("версия уже стоит везде"); fs.writeFileSync("/tmp/nothing", "1"); }
          '
          if [ -f /tmp/nothing ]; then exit 0; fi
          # Новое имя пакета реестр npm разносит не сразу: CDN несколько минут
          # отдаёт 404 на его сокращённые метаданные. Повтор с паузой.
          for i in $(seq 1 10); do
            pnpm install --lockfile-only --ignore-scripts && break
            [ "$i" = 10 ] && exit 1
            echo "pnpm install не прошёл (попытка $i), повтор через 60 с"
            sleep 60
          done
          git config user.name "docs-factory-bot"
          git config user.email "docs-factory-bot@coopenomics.world"
          git add -A
          git commit -m "[deps][@docs-factory-bot] config: @coopenomics/docs-factory и docs-templates ${VERSION} — зачем: выпуск фабрики и шаблонов документов встраивается в монорепу роботом выпуска"
          echo "SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      # Выпуск ради ветки: коммит прямо в неё. Ветку мог сдвинуть автор —
      # тогда коммит переносится на её свежую голову.
      - name: Версия в ветку выпуска
        if: env.MODE == 'branch' && env.SHA != ''
        working-directory: mono
        run: |
          for i in 1 2 3; do
            git push origin "HEAD:${BASE}" && exit 0
            git fetch --depth 50 origin "$BASE" && git rebase "origin/${BASE}" || { git rebase --abort; break; }
          done
          echo "FALLBACK=не удалось записать версию в ветку ${BASE}" >> "$GITHUB_ENV"

      # Выпуск без привязки: проверка монорепы теми же Typecheck, Check и Tests,
      # что у агента, — на полигоне ci/tests-docs-factory-vX.Y.Z.
      - name: Проверка монорепы на полигоне
        if: env.MODE == 'dev' && env.SHA != ''
        working-directory: mono
        run: |
          polygon="ci/tests-docs-factory-v${VERSION}"
          git push -f origin "HEAD:refs/heads/${polygon}"
          # Зеркало на GitHub синхронизируется по записи; запрос — ускорение.
          curl -s -o /dev/null -X POST -H "Authorization: token ${GITEA_TOKEN}" \
            "${GITEA_URL}/api/v1/repos/C9S/mono/push_mirrors-sync" || true
          verdict=""
          for i in $(seq 1 140); do
            runs=$(gh api "repos/coopenomics/mono/actions/runs?head_sha=${SHA}&per_page=50" \
              --jq '[.workflow_runs[] | select(.name=="Typecheck" or .name=="Check" or .name=="Tests") | {name, status, conclusion}]' 2>/dev/null || echo '[]')
            total=$(echo "$runs" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const r=JSON.parse(s||"[]");const names=new Set(r.map(x=>x.name));console.log(names.size)})')
            pending=$(echo "$runs" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const r=JSON.parse(s||"[]");console.log(r.filter(x=>x.status!=="completed").length)})')
            failed=$(echo "$runs" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const r=JSON.parse(s||"[]");console.log(r.filter(x=>x.status==="completed"&&x.conclusion!=="success").map(x=>x.name).join(","))})')
            if [ -n "$failed" ]; then verdict="красная проверка: $failed"; break; fi
            if [ "$total" = "3" ] && [ "$pending" = "0" ]; then verdict="green"; break; fi
            sleep 60
          done
          [ -z "$verdict" ] && verdict="проверка не дождалась итога за 140 минут"
          echo "вердикт полигона: $verdict"
          if [ "$verdict" = "green" ]; then echo "VERDICT=green" >> "$GITHUB_ENV"; else echo "FALLBACK=$verdict" >> "$GITHUB_ENV"; fi

      # Зелёный вердикт: коммит в dev. Dev мог сдвинуться вперёд — коммит версии
      # переносится на свежую голову; конфликт (lock-файл) — в PR.
      - name: Версия в dev
        if: env.MODE == 'dev' && env.VERDICT == 'green'
        working-directory: mono
        run: |
          for i in 1 2 3; do
            git push origin HEAD:dev && { git push origin --delete "ci/tests-docs-factory-v${VERSION}" || true; exit 0; }
            git fetch --depth 50 origin dev && git rebase origin/dev || { git rebase --abort; break; }
          done
          echo "FALLBACK=не удалось записать версию в dev (конфликт или защита ветки)" >> "$GITHUB_ENV"

      # Единственный случай PR: встроить сам робот не смог. PR чинит агент.
      - name: PR при неудаче
        if: env.FALLBACK != ''
        working-directory: mono
        run: |
          branch="deps/docs-factory-v${VERSION}"
          git push -f origin "HEAD:refs/heads/${branch}"
          body=$(node -e '
            const v = process.env.VERSION;
            console.log(JSON.stringify({
              base: process.env.BASE, head: `deps/docs-factory-v${v}`,
              title: `@coopenomics/docs-factory и docs-templates ${v} — робот не встроил сам`,
              body: `Выпуск ${v} (тег v${v} в C9S/docs-factory). Робот выпуска не встроил версию в ${process.env.BASE}: ${process.env.FALLBACK}.\n\nPR чинит агент: разобрать причину, довести проверку до зелёной и влить.`
            }))')
          curl -sf -X POST -H "Authorization: token ${GITEA_TOKEN}" -H "Content-Type: application/json" \
            "${GITEA_URL}/api/v1/repos/C9S/mono/pulls" -d "$body" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const r=JSON.parse(s);console.log("PR", r.number, r.html_url)})'
          echo "::error::Робот не встроил версию ${VERSION} в ${BASE}: ${FALLBACK}"
          exit 1
